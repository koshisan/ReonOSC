<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ReonOSC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Visible error catcher so we don't get a blank window if a script throws. -->
  <script>
    (function () {
      function show(text) {
        const root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<pre style="white-space:pre-wrap;color:#f87171;background:#1a1f29;padding:24px;margin:0;' +
          'min-height:100vh;font:13px/1.5 ui-monospace, Consolas, monospace;">' +
          text.replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;') + '</pre>';
      }
      window.addEventListener('error', (e) => {
        show('[script error]\n' + (e.message || '') +
          (e.filename ? '\n  at ' + e.filename + ':' + e.lineno + ':' + e.colno : '') +
          (e.error && e.error.stack ? '\n\n' + e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', (e) => {
        show('[unhandled promise rejection]\n' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
      });
      // If nothing rendered after 6s, dump a diagnostic.
      setTimeout(() => {
        if (document.getElementById('root') && !document.getElementById('root').firstChild) {
          show('[boot timeout — nothing rendered after 6s]\n' +
            'React loaded: ' + !!window.React + '\n' +
            'ReactDOM loaded: ' + !!window.ReactDOM + '\n' +
            'Babel loaded: ' + !!window.Babel + '\n' +
            'reonBridge loaded: ' + !!window.reonBridge + '\n' +
            'ReonDevice loaded: ' + !!window.ReonDevice);
        }
      }, 6000);
    })();
  </script>

  <!-- Theme: follow the OS unless the user has explicitly toggled (which writes
       reon.theme into localStorage). Done inline to avoid FOUC. -->
  <script>
    window.__TWEAKS_DEFAULTS = { theme: "system", showSparkline: true };
    (function () {
      const saved = localStorage.getItem('reon.theme');
      const osDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const effective = (saved === 'dark' || saved === 'light') ? saved : (osDark ? 'dark' : 'light');
      document.documentElement.dataset.theme = effective;
      // hint to the engine for native scrollbars / form controls
      document.documentElement.style.colorScheme = effective;
    })();
  </script>

  <!-- Bridge to the C# host (WebView2). Loaded before the React app. -->
  <script src="reon-bridge.js"></script>
  <script type="text/babel" src="device.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
